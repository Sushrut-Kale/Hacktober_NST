<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="vikasa-bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#04060A"/>
    </linearGradient>

    <!-- Outer Cyber Border Gradient -->
    <linearGradient id="vikasa-border" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Left Wing Gradient: Electric Cyan to Deep Indigo -->
    <linearGradient id="left-wing-grad" x1="26" y1="24" x2="64" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Left Inner Facet: Cyan Glow -->
    <linearGradient id="left-facet-grad" x1="38" y1="24" x2="64" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Right Verification Arm Gradient: Vibrant Emerald to Hyper Cyan -->
    <linearGradient id="check-wing-grad" x1="50" y1="92" x2="104" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="40%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Verification Checkmark Inner Glow -->
    <linearGradient id="check-glow-grad" x1="58" y1="84" x2="100" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="60%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Nexus Diamond Star Gradient -->
    <linearGradient id="nexus-grad" x1="56" y1="44" x2="72" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="ambient-glow" cx="64" cy="60" r="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for Soft Holographic Glow -->
    <filter id="holo-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle Shield -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#vikasa-bg)" stroke="url(#vikasa-border)" stroke-width="2.5"/>

  <!-- Background Ambient Glow -->
  <circle cx="64" cy="60" r="46" fill="url(#ambient-glow)"/>

  <!-- Cybernetic Grid Accent Nodes -->
  <path d="M16 40 H24 M104 40 H112 M16 88 H24 M104 88 H112" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>

  <!-- LEFT WING OF 'V' (Dimensional Cyber Bevel) -->
  <path d="M26 26 C25 26 24 27 24 28.5 L24 33 C24 35 25 36.5 26.5 37.5 L56 86 C58 89.5 62 90 64.5 87 L67 84 L39 26 Z" 
        fill="url(#left-wing-grad)"/>

  <!-- Left Inner Facet Accent -->
  <path d="M39 26 L49 26 L67 78 L61 84 Z" 
        fill="url(#left-facet-grad)"/>

  <!-- SHIELD BRIDGE / NEURAL CROSS-BEAM -->
  <path d="M48 46 L64 58 L80 46 L64 38 Z" 
        fill="#1E293B" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- RIGHT ARM: VERIFICATION ASCENT CHECKMARK (Luminous & Elevated) -->
  <g filter="url(#holo-glow)">
    <!-- Base Check Wing -->
    <path d="M46 58 L60 80 C61.5 82.5 65 83 67 80.5 L102 29 C103 27.5 102 25 100 25 L88 25 C86.5 25 85 26 84 27.5 L64 63 L54 48 C53 46.5 51 46 49.5 47 L46.5 49 C45 50 45 52.5 46 54 Z" 
          fill="url(#check-wing-grad)"/>

    <!-- High-Luster Verification Ridge -->
    <path d="M84 27.5 L100 25 L67 80.5 L64 74 L84 31 Z" 
          fill="url(#check-glow-grad)" opacity="0.6"/>
  </g>

  <!-- CENTRAL VERIFICATION NEXUS STAR -->
  <g filter="drop-shadow(0 0 6px #00F0FF)">
    <path d="M64 42 L66.5 50 L74.5 52.5 L66.5 55 L64 63 L61.5 55 L53.5 52.5 L61.5 50 Z" 
          fill="url(#nexus-grad)"/>
    <circle cx="64" cy="52.5" r="2" fill="#FFFFFF"/>
  </g>

  <!-- LOWER SENTINEL STATUS NODE -->
  <circle cx="64.5" cy="95" r="3.5" fill="#10B981" filter="drop-shadow(0 0 5px #10B981)"/>
  <circle cx="64.5" cy="95" r="1.5" fill="#E0F2FE"/>
</svg>
